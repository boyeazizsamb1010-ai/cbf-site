<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – {{nom}}</title>
  <meta name="description" content="Contactez-nous par WhatsApp, email ou en vous déplaçant dans nos locaux.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cheikh Baye Fall Cargo">
  <meta property="og:title" content="Contact – Cheikh Baye Fall Cargo">
  <meta property="og:description" content="Contactez-nous sur WhatsApp, par email ou par téléphone.">
  <meta property="og:url" content="https://cbf-guangzhou.com/contact.html">
  <meta property="og:image" content="https://cbf-guangzhou.com/images/logo-complet.jpg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/logo-emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-titre">
      <div data-i18n="cat.eyebrow" class="eyebrow">Sur le site</div>
      <h1 data-i18n="c.h1">Écrivez-nous sur WhatsApp.</h1>
      <p data-i18n="c.sub">Nos coordonnées et un formulaire qui ouvre directement WhatsApp.</p>
    </div>
    <div class="contact-grille">
      <div class="bloc">
        <h2 data-i18n="c.coords">Nos coordonnées</h2>
        <div class="info-ligne"><div><strong data-i18n="c.addr">Adresse</strong><span id="c-adresse"></span></div></div>
        <div class="info-ligne"><div><strong data-i18n="c.hours">Horaires</strong><span id="c-horaires"></span></div></div>
        <div class="info-ligne"><div><strong data-i18n="c.email">Email</strong><a id="c-email"></a></div></div>
        <div class="info-ligne"><div><strong data-i18n="c.wa">WhatsApp</strong><span id="c-wa"></span></div></div>
        <div class="info-ligne" id="c-autres-ligne"><div><strong data-i18n="c.others">Autres numéros</strong><span id="c-autres"></span></div></div>
        <a data-i18n="c.open" class="btn btn-wa btn-block" id="c-btn" target="_blank" rel="noopener" style="margin-top:14px">Ouvrir WhatsApp</a>
      </div>
      <form class="bloc" id="form" novalidate>
        <h2 data-i18n="c.formh">Envoyez un message</h2>
        <div class="champ"><label data-i18n="f.name" for="nom">Nom *</label><input id="nom" required autocomplete="name"></div>
        <div class="ligne2">
          <div class="champ"><label for="email" data-i18n="f.email">Email</label><input id="email" type="email" autocomplete="email"></div>
          <div class="champ"><label data-i18n="f.tel" for="tel">Téléphone</label><input id="tel" type="tel" autocomplete="tel"></div>
        </div>
        <div class="champ"><label data-i18n="f.msg" for="msg">Votre message *</label><textarea id="msg" rows="5" required></textarea></div>
        <button data-i18n="f.send" class="btn btn-wa btn-block" type="submit">Envoyer sur WhatsApp</button>
        <p data-i18n="f.note" class="note">Le message s'ouvre dans WhatsApp, il vous reste à l'envoyer.</p>
      </form>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/descriptions.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
